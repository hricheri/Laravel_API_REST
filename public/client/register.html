<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up — Tattoo Swap</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="page">
        <div class="header">
            <h1>🎨 Tattoo Swap</h1>
            <p>Create your artist account</p>
        </div>

        <div class="card">
            <div id="error-box" class="alert alert-error" style="display: none;"></div>

            <form onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required minlength="8">
                </div>

                <div class="form-group">
                    <label for="password_confirmation">Confirm Password</label>
                    <input type="password" id="password_confirmation" required minlength="8">
                </div>

                <div class="form-group">
                    <label for="city">City <span style="font-weight: 400; color: var(--gray-400);">(optional)</span></label>
                    <input type="text" id="city" placeholder="Where are you based?">
                </div>

                <div class="form-group">
                    <label for="bio">Bio <span style="font-weight: 400; color: var(--gray-400);">(optional)</span></label>
                    <textarea id="bio" placeholder="Tell other artists about yourself..."></textarea>
                </div>

                <div class="form-group">
                    <label for="profile_photo">Profile Photo <span style="font-weight: 400; color: var(--gray-400);">(optional)</span></label>
                    <input type="file" id="profile_photo" accept="image/*">
                </div>

                <button type="submit" id="submit-btn" class="btn btn-primary btn-block">Create Account</button>
            </form>
        </div>

        <p class="center">
            Already have an account? <a href="login.html" class="link">Log in</a>
        </p>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
