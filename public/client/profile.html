<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile — Tattoo Swap</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="page-wide">
        <nav class="nav">
            <a href="profile.html" class="active">My Profile</a>
            <a href="explore.html">Explore</a>
            <a href="favorites.html">Favorites</a>
            <a href="swaps.html">Swaps</a>
            <a href="availability.html">Availability</a>
            <a href="#" onclick="handleLogout()">Log Out</a>
        </nav>

        <div class="header">
            <h1>My Profile</h1>
        </div>

        <div id="status-box" class="alert alert-success" style="display: none;"></div>
        <div id="error-box" class="alert alert-error" style="display: none;"></div>

        <div class="card center" id="profile-view">
            <p>Loading...</p>
        </div>

        <div class="card">
            <h2 style="font-size: 1.1rem; margin-top: 0;">Edit Profile</h2>

            <form onsubmit="handleUpdateProfile(event)">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name">
                </div>

                <div class="form-group">
                    <label for="city">City</label>
                    <input type="text" id="city">
                </div>

                <div class="form-group">
                    <label for="bio">Bio</label>
                    <textarea id="bio"></textarea>
                </div>

                <div class="form-group">
                    <label for="profile_photo">Profile Photo</label>
                    <input type="file" id="profile_photo" accept="image/*">
                </div>

                <button type="submit" id="submit-btn" class="btn btn-primary btn-block">Save Changes</button>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/profile.js"></script>
</body>
</html>
