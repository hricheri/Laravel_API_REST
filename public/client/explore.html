<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore — Tattoo Swap</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .filter-btn {
            font-family: inherit;
            font-weight: 700;
            font-size: 0.85rem;
            border: none;
            background: var(--gray-100);
            color: var(--gray-700);
            padding: 0.55rem 1rem;
            border-radius: 0.9rem;
            cursor: pointer;
        }
        .filter-btn.active-filter {
            background: var(--lima-300);
            color: var(--gray-900);
        }
    </style>
</head>
<body>
    <div class="page-wide">
        <nav class="nav">
            <a href="profile.html">My Profile</a>
            <a href="explore.html" class="active">Explore</a>
            <a href="favorites.html">Favorites</a>
            <a href="swaps.html">Swaps</a>
            <a href="availability.html">Availability</a>
            <a href="#" onclick="handleLogout()">Log Out</a>
        </nav>

        <div class="header">
            <h1>Explore</h1>
            <p>Discover artists to swap with</p>
        </div>

        <div id="error-box" class="alert alert-error" style="display: none;"></div>

        <div style="display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1.5rem;">
            <button id="filter-all" class="filter-btn active-filter" onclick="setFilter('all')">See Everyone</button>
            <button id="filter-city" class="filter-btn" onclick="setFilter('city')">By City</button>
        </div>

        <div id="city-filter-box" style="display: none; gap: 0.5rem; margin-bottom: 1.5rem;">
            <input type="text" id="city-input" placeholder="Enter a city...">
            <button class="btn btn-secondary" onclick="loadExplore()">Search</button>
        </div>

        <div id="artists-container"></div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/explore.js"></script>
</body>
</html>
