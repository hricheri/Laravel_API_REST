<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Availability — Tattoo Swap</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="page">
        <nav class="nav">
            <a href="profile.html">My Profile</a>
            <a href="explore.html">Explore</a>
            <a href="favorites.html">Favorites</a>
            <a href="swaps.html">Swaps</a>
            <a href="availability.html" class="active">Availability</a>
            <a href="#" onclick="handleLogout()">Log Out</a>
        </nav>

        <div class="header">
            <h1>My Availability</h1>
            <p>Select a date range, or tap individual days</p>
        </div>

        <div id="error-box" class="alert alert-error" style="display: none;"></div>

        <div class="card">
            <label style="font-weight: 700; font-size: 0.85rem; color: var(--gray-700); margin-bottom: 0.5rem; display: block;">Select a range</label>
            <div style="display: flex; gap: 0.5rem; align-items: end; margin-bottom: 1.25rem; flex-wrap: wrap;">
                <div style="flex: 1; min-width: 130px;">
                    <input type="date" id="range-from" onchange="onRangeInputChange()">
                </div>
                <div style="flex: 1; min-width: 130px;">
                    <input type="date" id="range-to" onchange="onRangeInputChange()">
                </div>
            </div>

            <div id="calendar-container"></div>
            <div id="actions-container" style="margin-top: 1.25rem; padding-top: 1.25rem; border-top: 1px solid var(--gray-100);"></div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/availability.js"></script>
</body>
</html>
