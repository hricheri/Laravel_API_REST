<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In — Tattoo Swap</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="page">
        <div class="header">
            <h1>🎨 Tattoo Swap</h1>
            <p>Log in to your account</p>
        </div>

        <div class="card">
            <div id="error-box" class="alert alert-error" style="display: none;"></div>

            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required>
                </div>

                <button type="submit" id="submit-btn" class="btn btn-primary btn-block">Log In</button>
            </form>
        </div>

        <p class="center">
            Don't have an account? <a href="register.html" class="link">Sign up</a>
        </p>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
